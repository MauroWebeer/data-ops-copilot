[project]
name = "data-ops-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mauro", email = "mauro.weber-partner@backlgrs.com.br" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.143.3",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langfuse[langchain]>=5.0.2",
    "pydantic-settings>=2.16.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
data-ops-copilot = "data_ops_copilot:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
